# LDW lipreading license
# LDW lipreading model. For Usage examples see https://github/???


Input:
  - [-1, 1, input, Input_video, []] #
# LDWLipv1 Encoder
Encoder:
  # [from, repeats, type, module, args]   # type: unit, block, module, network
  # visual encoder
  - [-1, 1, block, Conv3Dfrontend, [64, 5, 7]] # 0#
  - [-1, 1, unit, tensor3Dto2D, []]  # 1#
  - [-1, 1, network, ResNet, ["ResidualBlock", [2, 2, 2, 2], "swish"]]  # 2#
  - [-1, 1, unit, ViewtoBatch, []]  # 3#
  # sequence encoder
  - [-1, 1, unit, embed, [256, 0.1, "rel_mha"]]  # 4#
  - [-1, 12, module, ConformerLayer, [256, 4, 2048, 0.1, "rel_mha"]]
  - [-1, 1, unit, LayerNorm, [256]]
# LDWLipv1 Decoder
Decoder:
  - [-1, 1, decoder_, CTCDecoder, [3363, 256, 0.1, "builtin", True]]  # 7#
  - [-2, 1, decoder_, ATTDecoder, [3363, 256, 4, 2048, 6, 0.1]]
Loss:
  - [-2, 1, loss, loss_ctc, [3363, 256, 0.1, "builtin", True] ] # 8#
  - [-2, 1, loss, loss_att, [3363, -1, 0.1, False] ]
  - [[-1, -2], 1, loss_total, loss_total, [0.9, 0.1]]
Output:
  name: HybrideLipOutput
  output_param:
    lm_model: False
    rnnlm: run_exp/preweights/CMLR/lm_zh/model.pth
    rnnlm_conf: run_exp/preweights/CMLR/lm_zh/model.json
    beam_size: 10
    penalty: 0.3
    ctc_weight: 0.1
    lm_weight: 0.3

